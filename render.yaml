# SF Κέντρο στο Render (δωρεάν). Οδηγίες: DIAKOMISTIS-CLOUD.txt, επιλογή Α.
# Ο δίσκος του Render σβήνεται σε κάθε επανεκκίνηση: τα δεδομένα φυλάγονται στη βάση Supabase (αν δοθεί SFK_DATABASE_URL)
# ή σε ΙΔΙΩΤΙΚΟ αποθετήριο GitHub (που με τη βάση μένει ως ημερήσιο αντίγραφο ασφαλείας).
services:
  - type: web
    name: sf-kentro
    runtime: docker
    plan: free
    region: frankfurt
    branch: claude/friendly-sagan-bfjrkj
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    autoDeploy: true
    # no health check: on the small free machine a long piece of work (first read of the shops) is not a crash
    envVars:
      - key: NODE_OPTIONS             # μνήμη: μένει κάτω από τα 512 MB του δωρεάν μηχανήματος
        value: --max-old-space-size=280
      - key: SFK_GITHUB_DATA          # όνομα/αποθετήριο, π.χ. alexdimaras/sf-kentro-data (ιδιωτικό)
        sync: false
      - key: SFK_GITHUB_TOKEN         # fine-grained token: Contents read & write μόνο σε αυτό το αποθετήριο
        sync: false
      - key: SFK_ADMIN_USER           # ο πρώτος διαχειριστής (μόνο την πρώτη φορά)
        sync: false
      - key: SFK_ADMIN_PASSWORD       # τουλάχιστον 10 χαρακτήρες· άλλαξέ τον μετά από το πρόγραμμα
        sync: false
      - key: SFK_DATABASE_URL         # προαιρετικό: κοινή βάση Supabase (Session pooler, θύρα 5432). Δες DIAKOMISTIS-CLOUD.txt ★★
        sync: false
      - key: SFK_DB_CA                # προαιρετικό: το πιστοποιητικό SSL της βάσης (έλεγχος του διακομιστή της)
        sync: false
      - key: SFK_SECRET_KEY           # κλειδί για τους κωδικούς B2B (το φτιάχνει μόνο του το Render)
        generateValue: true
